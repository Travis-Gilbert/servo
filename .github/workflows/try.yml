name: Try

on:
  push:
    branches: ["try"]
  workflow_dispatch:
    inputs:
      profile:
        required: false
        default: "checked-release"
        type: choice
        options: ["checked-release", "release", "debug", "production"]
      build-args:
        default: ""
        required: false
        type: string
      wpt-args:
        default: ""
        required: false
        type: string
      wpt:
        required: false
        type: boolean
      unit-tests:
        required: false
        type: boolean
      devtools-tests:
        required: false
        type: boolean
      bencher:
        required: false
        type: boolean
      reuse-artifact:
        description: Run only the capped downstream WPT corpus against an existing successful Main artifact
        required: false
        default: false
        type: boolean
      engine-sha:
        description: Reuse mode only - reviewed full engine SHA
        required: false
        type: string
      build-run-id:
        description: Reuse mode only - successful same-repository Main run ID
        required: false
        type: string
      artifact-id:
        description: Reuse mode only - immutable checked-release-binary-linux artifact ID
        required: false
        type: string
      artifact-digest:
        description: Reuse mode only - exact artifact API sha256 digest
        required: false
        type: string

jobs:
  decision:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse-artifact) }}
    name: Generate Try Configuration
    runs-on: ubuntu-22.04
    outputs:
      configuration: ${{ steps.configuration.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            python/servo/try_parser.py
            .github/actions/setup-python
            .python-version
            uv.lock
          sparse-checkout-cone-mode: false
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Get Full Configuration
        id: full_config
        run: |
          {
            echo 'config<<EOF'
            python ./python/servo/try_parser.py
            echo EOF
           } >> $GITHUB_OUTPUT
      - name: Configuration
        id: configuration
        uses: actions/github-script@v8
        with:
          script: |
            // When triggered via a push try the `try` branch, search the last commit for a configuration object.
            if (${{ github.ref_name == 'try' }}) {
              let commit_msg = context.payload.head_commit.message;
              try {
                var config = JSON.parse(commit_msg.split('\n').slice(-1));

                if (config && typeof config === "object") {
                  console.log("Using try commit configuration: " + JSON.stringify(config));
                  return config;
                }
              }
              catch (exception) {
                console.log("Could not parse try configuration from commit message: " + exception);
                console.log("Triggering full try run.");
              }
            }

            // If we reach here we are likely doing a full run.
            configuration = ${{ steps.full_config.outputs.config }};

            // Process `workflow_dispatch` provided configuration overrides.
            if (context.eventName == "workflow_dispatch") {
              // WPT-related overrides only affect Linux currently, as tests don't run by default on other platforms.
              configuration.matrix[0].wpt = Boolean(${{ inputs.wpt }});
              configuration.matrix[0].wpt_args = "${{ inputs.wpt-args }}" || "";
              configuration.matrix[0].build_args = "${{ inputs.build-args }}" || "";

              let unit_tests = Boolean(${{ inputs.unit-tests }});
              let profile = '${{ inputs.profile }}';
              for (const platform of configuration.matrix) {
                platform.profile = profile;
                platform.unit_tests = unit_tests;
              }
            }

            console.log("Using configuration: " + JSON.stringify(configuration));
            return configuration;

  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse-artifact) }}
    needs: ["decision"]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: ${{ fromJson(needs.decision.outputs.configuration).fail_fast }}
      matrix:
        include: ${{ fromJson(needs.decision.outputs.configuration).matrix }}
    # We need to use `dipatch-workflow.yml` because workflows do not support using: ${}
    uses: ./.github/workflows/dispatch-workflow.yml
    secrets: inherit
    with:
      workflow: ${{ matrix.workflow }}
      wpt: ${{ matrix.wpt }}
      profile: ${{ matrix.profile }}
      unit-tests: ${{ matrix.unit_tests }}
      devtools-tests: ${{ matrix.devtools_tests }}
      build-libservo: ${{ matrix.build_libservo }}
      build-args: ${{ matrix.build_args }}
      wpt-args: ${{ matrix.wpt_args }}
      number-of-wpt-chunks: ${{ matrix.number_of_wpt_chunks }}
      bencher: ${{ matrix.bencher }}
      coverage: ${{ matrix.coverage }}
      capi: ${{ matrix.capi }}

  build-result:
    name: Result
    runs-on: ubuntu-latest
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.reuse-artifact) }}
    # `needs: "build"` is necessary to detect cancellation.
    needs: [ "decision", "build" ]
    steps:
      - name: Merge build timings
        continue-on-error: true
        uses: actions/upload-artifact/merge@v7
        with:
          name: cargo-timings
          pattern: cargo-timings-*
          delete-merged: true
      - name: Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  reuse-artifact-wpt:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse-artifact }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/downstream-wpt.yml
    with:
      engine-sha: ${{ inputs.engine-sha }}
      build-run-id: ${{ inputs.build-run-id }}
      artifact-id: ${{ inputs.artifact-id }}
      artifact-digest: ${{ inputs.artifact-digest }}
